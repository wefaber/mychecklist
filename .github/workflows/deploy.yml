name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-mychecklist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # El runner de la org tiene que ser el del VPS: el deploy escribe en /home/hermes y
    # reinicia mychecklist@*. Sin la etiqueta, cualquier runner self-hosted de WeFaber lo toma
    # y el preflight falla por rutas que no existen.
    runs-on: [self-hosted, vps-wefaber]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Put bun on PATH (package scripts call plain `bun`)
        run: echo /opt/bun >> "$GITHUB_PATH"

      - name: Install
        run: /opt/bun/bun install --frozen-lockfile

      - name: Check (tsc, oxlint, scoped, nginx, tests)
        run: /opt/bun/bun run check

      - name: Build
        run: /opt/bun/bun run build

      - name: Blue/green deploy
        run: bash deploy/mychecklist.sh "${{ github.sha }}"

      # El deploy ya exige /ready y / por el dominio. Esto agrega las rutas que nginx tiene que proxear a mano
      # (el workflow no instala el vhost): sin token, la app contesta 401 y un vhost viejo contesta 405.
      - name: Smoke público (dominio real)
        env:
          DOMAIN: checklist.wefaber.net
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          fail=0
          check() { # esperado, descripción, args de curl...
            want=$1; label=$2; shift 2
            got=$(code "$@" || true)
            echo "$label -> $got (esperado $want)"
            [ "$got" = "$want" ] || fail=1
          }
          check 200 "GET /ready" "https://$DOMAIN/ready"
          check 200 "GET /" "https://$DOMAIN/"
          check 401 "POST /codemode/execute" -X POST -H 'content-type: application/json' -d '{"code":"return 1"}' "https://$DOMAIN/codemode/execute"
          check 401 "POST /mcp" -X POST -H 'content-type: application/json' -d '{}' "https://$DOMAIN/mcp"
          exit $fail
