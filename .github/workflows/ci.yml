name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check (tsc, oxlint, scoped, nginx, tests)
        run: bun run check

      - name: Build
        run: bun run build

  # CLAUDE.md › Entrega: cada PR con código sube la versión de package.json. Si es igual a la de la base, el
  # deploy publicaría el mismo número con código distinto. Un PR que solo toca docs/ o *.md no necesita subirla:
  # así no pelea por la misma línea de package.json con los PRs de código.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La versión es distinta de la base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -vE '^docs/|\.md$' || true)
          if [ -z "$code" ]; then
            echo "Solo docs o Markdown: no hace falta subir la versión."
            exit 0
          fi
          echo "Archivos de código en el PR:"; echo "$code"
          head=$(jq -r .version package.json)
          base=$(git show "origin/$BASE_REF:package.json" | jq -r .version)
          echo "base=$base head=$head"
          if [ "$head" = "$base" ]; then
            echo "::error file=package.json::la versión $head ya está en $BASE_REF; subila antes de mergear"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=package.json::la versión $head es menor que la de la base ($base)"
            exit 1
          fi
