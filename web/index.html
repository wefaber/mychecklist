<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyChecklist</title>
    <meta
      name="description"
      content="Listas y tareas con Markdown, links a GitHub y una API para agentes."
    />
    <!-- Pinta el tema antes del primer render: paleta y modo guardados, o Forest con el modo del sistema (Vault es solo claro). -->
    <script>
      try {
        var p = localStorage.getItem('mychecklist.palette')
        if (['forest', 'azul', 'teal', 'vault'].indexOf(p) < 0) p = 'forest'
        var m = localStorage.getItem('mychecklist.mode')
        if (m !== 'light' && m !== 'dark')
          m = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
        document.documentElement.dataset.palette = p
        document.documentElement.dataset.theme = p === 'vault' ? 'light' : m
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
