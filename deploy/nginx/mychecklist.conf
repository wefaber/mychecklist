# checklist.wefaber.net — MyChecklist (deploy/nginx/mychecklist.conf del repo).
# El slot vivo lo decide snippets/mychecklist-active.conf ($mychecklist_port / $mychecklist_root),
# que escribe deploy/mychecklist.sh al cambiar de slot. Cert: /etc/letsencrypt/live/checklist.wefaber.net (DNS-01).
# Gate de origen: solo edge de Cloudflare o loopback.

include /etc/nginx/snippets/cloudflare-edge-gate.conf;

server {
    listen 167.114.2.210:80;
    listen [2607:5300:205:200::716d]:80;
    server_name checklist.wefaber.net;
    location / {
        if ($cf_edge_allowed = 0) { return 403; }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 167.114.2.210:443 ssl;
    listen [2607:5300:205:200::716d]:443 ssl;
    # Loopback explicito para probar nginx -> slot desde el host sin pasar por el edge:
    # curl --resolve checklist.wefaber.net:443:127.0.0.1 https://checklist.wefaber.net/ready
    listen 127.0.0.1:443 ssl;
    server_name checklist.wefaber.net;

    ssl_certificate     /etc/letsencrypt/live/checklist.wefaber.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checklist.wefaber.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/mychecklist-active.conf;
    root $mychecklist_root;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    client_max_body_size 3m;
    server_tokens off;

    if ($cf_edge_allowed = 0) { return 403; }

    include /etc/nginx/snippets/wellknown.conf;

    location /graphql { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /auth/   { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # SSE: sin buffer y con lectura larga (el servidor manda un ping cada 25 s).
    location = /events { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 1h; }
    # Adjuntos: subida de hasta 10 MB (el mismo tope que el servidor) y descarga con la caché que manda la app. Declarar
    # `add_header` acá apaga los del server, que pondrían `no-cache` encima del `private, immutable` del upstream.
    location /files/ { client_max_body_size 10m; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # Code Mode (ADR 0002 y 0007): cuerpos de hasta 64 KB y una ejecución dura como mucho ~6 s; sin buffering de respuesta.
    location /codemode/ { client_max_body_size 64k; proxy_read_timeout 15s; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /mcp { client_max_body_size 64k; proxy_read_timeout 15s; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # Exportar e importar (ADR 0008): el export llega completo (puede tardar) y el import admite hasta 48 MB de JSON.
    # `add_header` acá apaga los del server para que quede solo el `no-store` de la app.
    location /export/ { add_header X-Robots-Tag "noindex, nofollow" always; proxy_read_timeout 120s; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /import/ { client_max_body_size 48m; add_header X-Robots-Tag "noindex, nofollow" always; proxy_request_buffering off; proxy_read_timeout 120s; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://127.0.0.1:$mychecklist_port; }
    location = /ready  { proxy_pass http://127.0.0.1:$mychecklist_port; }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location /img/    { add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location / { try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
