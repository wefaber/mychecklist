# /etc/nginx/sites-available/checklist.wefaber.net  (TLS block added by certbot / the house setup)
# Public vhost (personal use). The tailnet vhost for organizations is mychecklist-tailnet.conf (ADR 0001).
# /etc/nginx/snippets/mychecklist-active.conf is written by deploy/mychecklist.sh and sets $mychecklist_port,
# $mychecklist_tailnet_port and $mychecklist_root.
server {
    listen 443 ssl;
    server_name checklist.wefaber.net;
    # ssl_certificate / ssl_certificate_key: as in the other wefaber.net vhosts.

    include snippets/mychecklist-active.conf;
    root $mychecklist_root;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    location /graphql { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # Login de GitHub y logout (redirecciones y cookies). X-Forwarded-For se pisa: lo usa el límite de intentos.
    location /auth/ { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # SSE: sin buffer y con lectura larga (el servidor manda un ping cada 25 s).
    location = /events { proxy_pass http://127.0.0.1:$mychecklist_port; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 1h; }
    # Adjuntos: subida de hasta 10 MB (el mismo tope que el servidor) y descarga con la caché que manda la app. Declarar
    # `add_header` acá apaga los del server, que pondrían `no-cache` encima del `private, immutable` del upstream.
    location /files/ { client_max_body_size 10m; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://127.0.0.1:$mychecklist_port; }
    location = /ready  { proxy_pass http://127.0.0.1:$mychecklist_port; }

    # Hashed assets are immutable; everything else falls back to the SPA shell.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location /img/    { add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location / { try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
