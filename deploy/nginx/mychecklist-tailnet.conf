# /etc/nginx/sites-available/checklist-tailnet  (ADR 0001: organizaciones solo por la tailnet)
# Escucha SOLO en la IP de Tailscale del VPS: nada de esto se ve desde internet.
# Apunta al listener de la tailnet (4163/4164), no al público: el ingress sale del puerto, no de un header.
# MYCHECKLIST_TAILNET_URL en ~/deploy/env/mychecklist.env tiene que ser el origen de este vhost, y ese mismo
# callback (<origen>/auth/github/callback) tiene que estar en la GitHub App.
# Hoy va en HTTP: un certificado de ts.net se saca con `tailscale cert`, que necesita HTTPS habilitado en el
# tailnet desde la consola de Tailscale.
server {
    listen 100.113.187.112:80;
    server_name checklist.tail7f613b.ts.net vps-660e4a8c.tail7f613b.ts.net;

    include snippets/mychecklist-active.conf;
    root $mychecklist_root;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    location /graphql { proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /auth/   { proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # SSE: sin buffer y con lectura larga (el servidor manda un ping cada 25 s).
    location = /events { proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 1h; }
    # Adjuntos: subida de hasta 10 MB (el mismo tope que el servidor).
    location /files/  { client_max_body_size 10m; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    # Code Mode (ADR 0002 y 0007): cuerpos de hasta 64 KB y una ejecución dura como mucho ~6 s; sin buffering de respuesta.
    location /codemode/ { client_max_body_size 64k; proxy_read_timeout 15s; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /mcp { client_max_body_size 64k; proxy_read_timeout 15s; add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; }
    location = /ready  { proxy_pass http://127.0.0.1:$mychecklist_tailnet_port; }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location /img/    { add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
    location / { try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
